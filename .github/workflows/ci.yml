name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [desktop, mobile]
    name: E2E (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_DATA_KEY: ${{ secrets.DATA_KEY }}

      - name: E2E tests (${{ matrix.project }})
        run: npm run test:e2e -- --project=${{ matrix.project }}
        working-directory: frontend
        env:
          VITE_DATA_KEY: ${{ secrets.DATA_KEY }}
