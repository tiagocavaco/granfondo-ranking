name: Scrape

on:
  schedule:
    - cron: "0 20 * * 0"  # every Sunday at 20:00 UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI
    inputs:
      force:
        description: "Ignore cache — re-scrape every event"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: npm run ${{ inputs.force && 'scrape:force' || 'scrape' }}
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/ scraper/scraped-events.json
          git diff --staged --quiet || git commit -m "chore: update scraped results"
          git push
