name: Scrape Participants

on:
  schedule:
    - cron: "0 20 * * 5"  # every Friday at 20:00 UTC — event-window check decides whether to run
  workflow_dispatch:        # manual trigger bypasses the event-window check

permissions:
  contents: write

jobs:
  scrape-participants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT }}

      - name: Check event window
        id: window
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PYEOF'
          import json, datetime, os, sys

          events = json.load(open('scraper/event-schedule.json'))
          today = datetime.date.today()

          for event in events:
              d = datetime.date.fromisoformat(event['date'])
              # Run 2 nights before (diff=-2) or 3 nights before as buffer (diff=-3)
              diff = (today - d).days
              if -3 <= diff <= -2:
                  print(f"Upcoming event: {event['name']} on {event['date']}")
                  open(os.environ['GITHUB_OUTPUT'], 'a').write('run=true\n')
                  sys.exit(0)

          print('No event in participants window today — skipping scrape')
          open(os.environ['GITHUB_OUTPUT'], 'a').write('run=false\n')
          PYEOF

      - uses: actions/setup-node@v4
        if: github.event_name != 'schedule' || steps.window.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.window.outputs.run == 'true'
        run: npm install

      - name: Scrape participants
        if: github.event_name != 'schedule' || steps.window.outputs.run == 'true'
        run: npm run scrape:participants
        working-directory: scraper
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}

      - name: Commit updated participant files
        if: github.event_name != 'schedule' || steps.window.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          git diff --staged --quiet || git commit -m "chore: update participants"
          git push
